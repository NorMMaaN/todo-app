name: CI Pipeline

# Когда запускать
on:
  push:                # При отправке кода
    branches: [ main ]  # на ветку main
  pull_request:         # При создании Pull Request
    branches: [ main ]

# Что делать
jobs:
  test:
    runs-on: ubuntu-latest  # Используем виртуальную машину с Ubuntu
    
    steps:
    - name: Получить код
      uses: actions/checkout@v3
    
    - name: Установить Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Установить зависимости
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Проверить код
      run: |
        cd backend
        python -m py_compile app.py
        echo "✅ Проверка кода пройдена"
    
    - name: Запустить тесты
      run: |
        cd backend
        echo "Запускаем тесты..."
        # Если бы у нас были тесты, они бы запустились здесь
        echo "✅ Все тесты пройдены"