<!DOCTYPE html>
<html>
<head>
    <title>Мои задачи</title>
    <style>
        body { font-family: Arial; max-width: 500px; margin: 0 auto; padding: 20px; }
        .task { padding: 10px; border-bottom: 1px solid #ccc; }
        button { background: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; }
        input { padding: 10px; width: 70%; }
    </style>
</head>
<body>
    <h1>Мои задачи</h1>
    
    <div>
        <input id="taskInput" placeholder="Новая задача">
        <button onclick="addTask()">Добавить</button>
    </div>
    
    <div id="tasks"></div>

    <script>
        // Простой код без ошибок
        async function loadTasks() {
            let res = await fetch('http://127.0.0.1:5000/api/tasks');
            let tasks = await res.json();
            
            let html = '';
            for (let task of tasks) {
                html += `<div class="task">
                    ${task.title} 
                    <button onclick="deleteTask(${task.id})">✕</button>
                </div>`;
            }
            document.getElementById('tasks').innerHTML = html || 'Нет задач';
        }

        async function addTask() {
            let title = document.getElementById('taskInput').value;
            if (!title) return;
            
            await fetch('http://127.0.0.1:5000/api/tasks', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: title})
            });
            
            document.getElementById('taskInput').value = '';
            loadTasks();
        }

        async function deleteTask(id) {
            await fetch('http://127.0.0.1:5000/api/tasks/' + id, {
                method: 'DELETE'
            });
            loadTasks();
        }

        // Загрузить задачи при открытии страницы
        loadTasks();
    </script>
</body>
</html>
